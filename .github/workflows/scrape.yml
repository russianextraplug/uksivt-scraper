name: Scrape Schedule
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install playwright beautifulsoup4 && playwright install chromium
      - run: python github_scraper.py
      
      # Если скрипт упал, сохраняем HTML для отладки
      - name: Upload Debug HTML
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: debug-html
          path: debug.html
          
      - name: Commit and push changes
        if: success()
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email "action@github.com"
          git add cache.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update schedule"
          git push
