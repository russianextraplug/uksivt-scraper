name: Scrape Schedule
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      # Устанавливаем системные зависимости, включая Xvfb для виртуального экрана
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip install playwright beautifulsoup4
          playwright install chromium
      
      # Запускаем скрипт через xvfb-run
      - name: Run scraper
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python github_scraper.py
      
      # Сохраняем HTML для отладки, если скрипт упал
      - name: Upload Debug HTML
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: debug.html
          
      - name: Commit and push changes
        if: success()
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email "action@github.com"
          git add cache.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update schedule"
          git push
